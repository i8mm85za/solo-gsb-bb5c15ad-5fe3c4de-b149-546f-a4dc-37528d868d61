services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/lab.db
    volumes:
      - lab-data:/data
    restart: unless-stopped
    healthcheck:
      # 启动钩子完成建表后 /health 才可用，据此判断初始化是否就绪
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else sys.exit(1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  lab-data:
